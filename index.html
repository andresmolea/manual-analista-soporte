<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manual del Analista de Soporte Técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --paper: #f5faf7;
    --surface: #ffffff;
    --ink: #122620;
    --ink-soft: #52695e;
    --ink-faint: #8aa89a;
    --chip-fill: #0d3d2b;
    --chip-ink: #ffffff;
    --accent: #13805B;
    --accent-soft: #e1f2ea;
    --line: #d7ebe0;
    --warning: #b35900;
    --warning-soft: #fbe6d2;
    --dark-chip: #0a2219;
    --dark-chip-ink: #ffd864;
    --v-rides: #8E43C0;
    --v-delivery: #13805B;
    --v-b2b: #D9A520;
    --v-avances: #7B1E3D;
    --v-ticketmundo: #C0392B;
    --v-marketplace: #0E8FBF;
    --v-todos: #2F5FA8;
    --section-color: #0f7a5c;
    --shadow: 0 10px 26px rgba(10,60,40,0.14);
    --shadow-sm: 0 2px 8px rgba(10,60,40,0.10);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-pill: 999px;
    --font-display: 'Fredoka', ui-rounded, -apple-system, sans-serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0b1813; --surface: #11291f; --ink: #eaf6f0; --ink-soft: #a7c7b8; --ink-faint: #76998a;
      --chip-fill: #1f8f63; --chip-ink: #ffffff;
      --accent: #4ddba0; --accent-soft: #163a2b;
      --line: #1e3a2c; --warning: #f0a84d; --warning-soft: #3a2611;
      --dark-chip: #081510; --dark-chip-ink: #ffd864;
      --v-rides: #a568d1; --v-delivery: #2bc78d; --v-b2b: #e0b530; --v-avances: #c65d7b; --v-ticketmundo: #e0695d; --v-marketplace: #4fc3e0;
      --v-todos: #7fa8e8;
      --section-color: #57d9ac;
      --shadow: 0 10px 26px rgba(0,0,0,0.5); --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0b1813; --surface: #11291f; --ink: #eaf6f0; --ink-soft: #a7c7b8; --ink-faint: #76998a;
    --chip-fill: #1f8f63; --chip-ink: #ffffff;
    --accent: #4ddba0; --accent-soft: #163a2b;
    --line: #1e3a2c; --warning: #f0a84d; --warning-soft: #3a2611;
    --dark-chip: #081510; --dark-chip-ink: #ffd864;
    --v-rides: #a568d1; --v-delivery: #2bc78d; --v-b2b: #e0b530; --v-avances: #c65d7b; --v-ticketmundo: #e0695d; --v-marketplace: #4fc3e0;
    --v-todos: #7fa8e8;
    --section-color: #57d9ac;
    --shadow: 0 10px 26px rgba(0,0,0,0.5); --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); }
  body { padding: 20px 16px 60px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .brand-header { position: relative; background: linear-gradient(135deg, #1fae79, #0a3d2b); color: #ffffff; border-radius: var(--radius-lg); padding: 22px 24px 26px; margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .brand-header::after { content: ""; position: absolute; top: -34px; right: -34px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.14); }
  .brand-lockup { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; position: relative; z-index: 1; }
  .brand-kicker { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.75; }
  h1 { font-family: var(--font-display); font-size: clamp(22px, 4.6vw, 31px); font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; position: relative; z-index: 1; color: #ffffff; }
  .sub { font-size: 14px; opacity: 0.85; max-width: 48ch; position: relative; z-index: 1; color: #ffffff; }
  .brand-dots { position: absolute; bottom: 16px; right: 20px; display: flex; gap: 6px; }
  .brand-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); display: block; }
  .brand-logo { position: absolute; top: 20px; right: 22px; height: 24px; width: auto; z-index: 2; }
  .tabs { position: sticky; top: 10px; z-index: 6; display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .tab-btn { flex: 1; font-family: var(--font-display); font-size: 13.5px; font-weight: 600; color: var(--ink-soft); background: none; border: none; padding: 9px 10px; border-radius: var(--radius-pill); cursor: pointer; transition: background .15s ease, color .15s ease; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { background: var(--chip-fill); color: var(--chip-ink); box-shadow: var(--shadow-sm); }
  .verticals { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .v-btn { font-family: var(--font-display); font-size: 12px; font-weight: 600; padding: 6px 13px; border-radius: var(--radius-pill); cursor: pointer; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-soft); transition: all .15s ease; }
  .v-btn:hover { border-color: var(--ink-faint); }
  .v-btn.active { color: #ffffff; border-color: transparent; }
  .v-btn.active { box-shadow: var(--shadow-sm); }
  .v-btn.v-todos.active { background: var(--v-todos); }
  .v-btn.v-rides.active { background: var(--v-rides); }
  .v-btn.v-delivery.active { background: var(--v-delivery); }
  .v-btn.v-b2b.active { background: var(--v-b2b); color: #2b2206; }
  .v-btn.v-avances.active { background: var(--v-avances); }
  .v-btn.v-ticketmundo.active { background: var(--v-ticketmundo); }
  .v-btn.v-marketplace.active { background: var(--v-marketplace); }
  .section-divider { font-family: var(--font-display); font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--section-color); margin: 26px 2px 14px; padding-bottom: 8px; border-bottom: 2px solid var(--section-color); }
  .section-divider:first-child { margin-top: 2px; }
  .section-divider.hidden { display: none; }
  .vertical-divider.rides { color: var(--v-rides); border-color: var(--v-rides); }
  .vertical-divider.delivery { color: var(--v-delivery); border-color: var(--v-delivery); }
  .vertical-divider.b2b { color: var(--v-b2b); border-color: var(--v-b2b); }
  .vertical-divider.avances { color: var(--v-avances); border-color: var(--v-avances); }
  .vertical-divider.ticketmundo { color: var(--v-ticketmundo); border-color: var(--v-ticketmundo); }
  .vertical-divider.marketplace { color: var(--v-marketplace); border-color: var(--v-marketplace); }
  .vertical-divider.none { color: var(--ink-faint); border-color: var(--line); }
  .vtag { display: inline-block; font-family: var(--font-display); font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); margin-left: 6px; margin-bottom: 10px; color: #ffffff; }
  .vtag.rides { background: var(--v-rides); }
  .vtag.delivery { background: var(--v-delivery); }
  .vtag.b2b { background: var(--v-b2b); color: #2b2206; }
  .vtag.avances { background: var(--v-avances); }
  .vtag.ticketmundo { background: var(--v-ticketmundo); }
  .vtag.marketplace { background: var(--v-marketplace); }
  .search-box { position: sticky; top: 58px; background: var(--paper); padding: 0 0 14px; z-index: 5; }
  #search { width: 100%; padding: 13px 16px; font-size: 15.5px; font-family: var(--font-body); font-weight: 500; border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
  #search::placeholder { color: var(--ink-faint); }
  #search:focus { outline: none; border-color: var(--chip-fill); box-shadow: 0 0 0 4px var(--accent-soft); }
  .count { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
  .card h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 2px 0 10px; color: var(--ink); }
  .card h2.rides { color: var(--v-rides); }
  .card h2.delivery { color: var(--v-delivery); }
  .card h2.b2b { color: var(--v-b2b); }
  .card h2.avances { color: var(--v-avances); }
  .card h2.ticketmundo { color: var(--v-ticketmundo); }
  .card h2.marketplace { color: var(--v-marketplace); }
  .card.hidden { display: none; }
  .card p { font-size: 14.5px; line-height: 1.6; margin: 0 0 8px; }
  .card ol, .card ul { font-size: 14.5px; line-height: 1.6; margin: 0 0 8px; padding-left: 20px; }
  .card li { margin-bottom: 6px; }
  .card table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
  .card th, .card td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .card th { color: var(--ink-faint); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card code, .card pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .card pre { background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; overflow-x: auto; white-space: pre-wrap; }
  .tool-list { display: flex; flex-direction: column; }
  .tool-row { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .tool-row:first-child { padding-top: 0; }
  .tool-row:last-child { border-bottom: none; padding-bottom: 0; }
  .tool-name { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .tool-name:hover { text-decoration: underline; }
  .tool-ext { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
  .tool-desc { font-size: 13px; line-height: 1.5; color: var(--ink-soft); margin: 3px 0 0; }
  .tag { display: inline-block; font-family: var(--font-display); font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 11px; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent); margin-bottom: 10px; }
  .tag.caso { background: var(--chip-fill); color: var(--chip-ink); }
  .tag.cierre { background: var(--dark-chip); color: var(--dark-chip-ink); }
  .tag.pend { background: var(--warning-soft); color: var(--warning); }
  .tag.biblia { background: linear-gradient(135deg, var(--accent), var(--chip-fill)); color: #ffffff; }
  .tag.bot { background: var(--dark-chip); color: var(--dark-chip-ink); }
  .empty { text-align: center; color: var(--ink-faint); padding: 40px 0; display: none; font-family: var(--font-display); font-weight: 600; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>

ras revisar tu historial, confirmamos que ya recibiste un apoyo excepcional previo. Como se te informó, no es posible realizar nuevas anulaciones manuales.\nDebes esperar el tiempo que la aplicación te indica en pantalla.\nAdvertencia: El abuso de estas solicitudes puede ocasionar la suspensión de tu perfil. Te invitamos a cumplir el ciclo de espera automático para recuperar tu acceso.</pre>"

=2054200952#gid=2054200952\" target=\"_blank\">Sheet de incidencias<span class=\"tool-ext\">↗</span></a><p class=\"tool-desc\">Registro de incidencias.</p></div></div>"

var cardsEl = document.getElementById('cards');
var countEl = document.getElementById('count');
var emptyEl = document.getElementById('empty');

var vertClass = { Rides: 'rides', Delivery: 'delivery', B2B: 'b2b', Avances: 'avances', TicketMundo: 'ticketmundo', Marketplace: 'marketplace' };
var VERTICAL_ORDER = ['Rides', 'Delivery', 'B2B', 'Avances', 'TicketMundo', 'Marketplace'];

function verticalsOf(s) {
  if (!s.vertical) return [];
  return Array.isArray(s.vertical) ? s.vertical : [s.vertical];
}

var builtCards = [];
sections.forEach(function (s) {
  var verts = verticalsOf(s);
  var div = document.createElement('div');
  div.className = 'card';
  div.dataset.group = s.group;
  div.dataset.tag = s.tag;
  if (verts.length) div.dataset.vertical = verts.join(',');
  div.dataset.text = (s.title + ' ' + s.tag + ' ' + s.html.replace(/<[^>]+>/g, ' ')).toLowerCase();
  var tagClass = 'tag';
  if (s.tag === 'Pendiente') tagClass += ' pend';
  else if (s.tag === 'Caso') tagClass += ' caso';
  else if (s.tag === 'Cierre') tagClass += ' cierre';
  else if (s.tag === 'Biblia') tagClass += ' biblia';
  else if (s.tag === 'BOT') tagClass += ' bot';
  var vtagHtml = verts.map(function (v) { return '<span class="vtag ' + vertClass[v] + '">' + v + '</span>'; }).join('');
  var h2Class = verts.length === 1 ? ' class="' + vertClass[verts[0]] + '"' : '';
  div.innerHTML = '<span class="' + tagClass + '">' + s.tag + '</span>' + vtagHtml + '<h2' + h2Class + '>' + s.title + '</h2>' + s.html;
  builtCards.push({ el: div, group: s.group, verts: verts });
});

// "Casos" se agrupa y ordena siempre por pastilla de vertical.
// Un caso con varias pastillas aparece bajo cada una (se clona para las siguientes).
// Lo que no tiene vertical cae en "Sin categoría".
(function buildCasosOrder() {
  var byVertical = {};
  builtCards.forEach(function (c) {
    if (c.group !== 'casos') return;
    var verts = c.verts.length ? c.verts : ['__none__'];
    verts.forEach(function (v, idx) {
      var target = idx === 0 ? c.el : c.el.cloneNode(true);
      target.dataset.groupVertical = v;
      (byVertical[v] = byVertical[v] || []).push(target);
    });
  });
  VERTICAL_ORDER.forEach(function (v) {
    var cards = byVertical[v];
    if (!cards || !cards.length) return;
    var divider = document.createElement('div');
    divider.className = 'section-divider vertical-divider ' + vertClass[v];
    divider.dataset.vertical = v;
    divider.textContent = v;
    cardsEl.appendChild(divider);
    cards.forEach(function (c) { cardsEl.appendChild(c); });
  });
  if (byVertical.__none__ && byVertical.__none__.length) {
    var noneDivider = document.createElement('div');
    noneDivider.className = 'section-divider vertical-divider none';
    noneDivider.dataset.vertical = '__none__';
    noneDivider.textContent = 'Sin categoría';
    cardsEl.appendChild(noneDivider);
    byVertical.__none__.forEach(function (c) { cardsEl.appendChild(c); });
  }
})();

// El resto de pestañas (Inicio, Canales, Herramientas) no necesitan orden especial.
builtCards.forEach(function (c) {
  if (c.group !== 'casos') cardsEl.appendChild(c.el);
});

var activeGroup = 'inicio';
var activeVertical = 'todos';
document.getElementById('verticals').style.display = activeGroup === 'casos' ? 'flex' : 'none';

function updateCount(n) {
  countEl.textContent = n + (n === 1 ? ' resultado' : ' resultados');
}

function applyFilters() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  var terms = q.split(/\s+/).filter(Boolean);
  var visible = 0;
  var vertVisible = {};
  document.querySelectorAll('.card').forEach(function (card) {
    var groupMatch = card.dataset.group === activeGroup;
    var textMatch = terms.length === 0 || terms.every(function (t) { return card.dataset.text.indexOf(t) !== -1; });
    var vertMatch = activeGroup !== 'casos' || activeVertical === 'todos' || terms.length > 0 || card.dataset.groupVertical === activeVertical;
    var match = groupMatch && vertMatch && textMatch;
    card.classList.toggle('hidden', !match);
    if (match) visible++;
    if (match && activeGroup === 'casos') vertVisible[card.dataset.groupVertical] = true;
  });
  document.querySelectorAll('.vertical-divider').forEach(function (div) {
    div.classList.toggle('hidden', !(activeGroup === 'casos' && vertVisible[div.dataset.vertical]));
  });
  updateCount(visible);
  emptyEl.style.display = visible === 0 ? 'block' : 'none';
}
applyFilters();

document.getElementById('search').addEventListener('input', applyFilters);

document.getElementById('tabs').addEventListener('click', function (e) {
  var btn = e.target.closest('.tab-btn');
  if (!btn) return;
  activeGroup = btn.dataset.group;
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b === btn); });
  document.getElementById('verticals').style.display = activeGroup === 'casos' ? 'flex' : 'none';
  applyFilters();
});

document.getElementById('verticals').addEventListener('click', function (e) {
  var btn = e.target.closest('.v-btn');
  if (!btn) return;
  var v = btn.dataset.vertical;
  if (v !== 'todos') {
    var alreadyActive = btn.classList.contains('active');
    v = alreadyActive ? 'todos' : v;
  }
  activeVertical = v;
  document.querySelectorAll('.v-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.vertical === activeVertical); });
  applyFilters();
});
</script>
